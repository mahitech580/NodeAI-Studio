name: NodeAI Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodeai-ci
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Run API and streaming regression tests
        run: npm test

      - name: Report dependency audit findings and fail on critical issues
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const summary = report.metadata?.vulnerabilities || {};
          const findings = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).map((entry) => typeof entry === 'string' ? entry : ({
              title: entry.title,
              url: entry.url
            }))
          }));
          console.log(JSON.stringify({ summary, findings }, null, 2));
          if (Number(summary.critical || 0) > 0) {
            console.error('Critical dependency vulnerabilities must be resolved before merging.');
            process.exit(1);
          }
          NODE
