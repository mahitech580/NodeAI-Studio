name: NodeAI Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodeai-ci
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify JavaScript syntax
        run: npm run check
      - name: Run API and streaming regression tests
        run: npm test

      - name: Report dependency audit findings
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const r=require('./npm-audit-report.json'); const findings=Object.entries(r.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(a=>typeof a==='string'?a:{name:a.name,title:a.title,url:a.url,range:a.range})})); console.log(JSON.stringify({summary:r.metadata?.vulnerabilities,findings},null,2))"
